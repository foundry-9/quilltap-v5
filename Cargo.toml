[workspace]
resolver = "2"
members = [
    "crates/*",
]

# Workspace root. Members: quilltap-core (the portable engine — pure-function
# ports plus the cipher-correct DB layer, and the `api` boundary), quilltap-host
# (the composition root: cadence drivers + instance/path resolution),
# quilltap-harness (the differential tests), and quilltap-fixture-sanitizer
# (the real-snapshot sanitizer tool). quilltap-web / quilltap-cli /
# quilltap-tauri join as they're scaffolded.

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Charles Sebold"]

# The .dbkey wrapper runs PBKDF2-HMAC-SHA256 × 600 000 (v4's iteration count) on
# every provision/unlock; unoptimized that is tens of seconds per call, which the
# P4.0 engine/host tests pay repeatedly. Optimize just the crypto leaf crates in
# dev — tiny compile cost, orders-of-magnitude faster key derivation in tests.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
# The SQLite3MC amalgamation (the ChaCha20 page cipher) at -O0 makes every
# cold page read of a real-sized instance visibly slow in debug artifacts
# (dogfood, 2026-07-16: first list loads against the Friday copy). Same
# precedent as the crypto overrides above; forces ONE amalgamation recompile
# when first applied, then caches as usual (the pinned-version rule is about
# version bumps, not profile settings).
[profile.dev.package.quilltap-sqlite3mc-sys]
opt-level = 2

# Shared dependency versions live here so every crate pins the same ones.
# (Members opt in with `foo = { workspace = true }`.) Add as the port grows.
#
# rusqlite WITHOUT a bundled feature: quilltap-core's build.rs compiles the
# SQLite3MultipleCiphers amalgamation (sqleet/ChaCha20 default) and links it as
# `sqlite3`, so every consumer binds the correct cipher. `buildtime_bindgen`
# regenerates bindings against that header so versions can't drift.
# Do NOT add `bundled-sqlcipher*` — that is AES-only and returns NotADatabase on
# every real Quilltap database (the retired sqlcipher-probe proved this).
[workspace.dependencies]
rusqlite = { version = "0.37", default-features = false, features = ["buildtime_bindgen"] }
