[package]
name = "quilltap-core"
version = "0.0.630"
edition = "2021"
publish = false

# The portable engine. First real module: `dbkey` — reads and decrypts the
# `quilltap.dbkey` file exactly as lib/startup/dbkey.ts does, yielding the
# base64 pepper that keys every database. This is permanent code, not probe
# scratch: the production core derives the key this way at startup.
#
# TWO DIFFERENT CIPHERS — do not conflate them:
#   * The `.dbkey` FILE wraps the pepper with AES-256-GCM (the aes-gcm deps
#     below). Verified correct against Friday in Phase 0.
#   * The DATABASES themselves are encrypted with ChaCha20-Poly1305 (sqleet),
#     the DEFAULT cipher of better-sqlite3-multiple-ciphers — NOT SQLCipher,
#     despite every "sqlcipher" name in the v4 codebase. Confirmed via
#     `PRAGMA cipher` → "chacha20" on the real instance (2026-06-27).

[dependencies]
# DB cipher: SQLite3MultipleCiphers 2.3.5 (sqleet/ChaCha20 default), linked via
# the amalgamation compiled by the `quilltap-sqlite3mc-sys` crate (its pinned
# version keeps that 12 MB C compile cached across our version bumps). VERIFIED
# 2026-06-27: opened Friday (37 tables, 33 chars, 20320 memories) cipher=chacha20.
# Do NOT use rusqlite's bundled-sqlcipher (AES-only → NotADatabase on real DBs).
# The `db` module is the first consumer; `dbkey` itself needs no SQLite.
rusqlite = { workspace = true }
# Link-only: pulls the cipher-correct sqlite3 into the link (see the crate). Kept
# in the graph by `use quilltap_sqlite3mc_sys as _;` in lib.rs.
quilltap-sqlite3mc-sys = { path = "../quilltap-sqlite3mc-sys" }
serde = { version = "1", features = ["derive"] }
# preserve_order: `Value::Object` is an `IndexMap` emitting INSERTION order,
# matching v4's `JSON.stringify` for open-JSON columns (parameters / config /
# equippedOutfit / sillyTavernData / state / tagStyles / …) — the locked decision
# closing the open-JSON multi-key key-order seam.
serde_json = { version = "1", features = ["preserve_order"] }

# Regex engine for the ported name-matching / detail-extraction heuristics.
# Used only where v4 uses a RegExp; JS-vs-Rust fidelity is handled per call site
# (ASCII `\b`/`\d`/`\s` via `(?-u:...)`, Unicode `\p{L}\p{N}` boundaries checked
# explicitly, no backtracking/lookaround needed). Already in the lock tree.
regex = "1"

# Unicode NFD decomposition for the doc-edit diacritics matcher (v4's
# `String.prototype.normalize('NFD')`). Verified byte-exact against JS on the
# corpus (precomposed/decomposed Latin, Hangul); the `.nfd()` iterator is the
# canonical decomposition JS's NFD uses.
unicode-normalization = "0.1"

# Crypto for the .dbkey FILE wrapper only, matching lib/startup/pepper-crypto.ts:
#   AES-256-GCM cipher, PBKDF2-HMAC-<digest> key derivation.
aes-gcm = "0.10"          # AES-256-GCM (AEAD)
aes = "0.8"               # Aes256 block cipher, for the custom 16-byte-nonce GCM type
pbkdf2 = "0.12"           # PBKDF2
sha2 = "0.10"             # SHA-256 / SHA-512 (digest + pepper hash)
hmac = "0.12"             # HMAC for PBKDF2
hex = "0.4"               # hex <-> bytes for the .dbkey fields
base64 = "0.22"           # OpenRouter embedding base64-Float32 decode (model::embedding_wire)

# v4 UUIDs: repo `_create` mints ids via `crypto.randomUUID()` (RFC-4122 v4)
# when not pinned. The non-sync create path uses this; sync/fixtures pin the id.
uuid = { version = "1", features = ["v4"] }

# OS CSPRNG for the RNG tool's production byte source (`tools::rng::OsRandomBytes`
# — the same source `crypto.randomBytes` draws from). Differential runs inject a
# fixed byte stream instead, so this is exercised only on the production path.
getrandom = "0.2"

# ICU4X collation — faithful `String.prototype.localeCompare()` (no-arg) ordering
# for the port's `localeCompare` sites (compareVersions fallback, canonicalize
# tool-name sort, + the Phase-3 name sorts). Node's no-arg Collator resolves to
# en-US / tertiary (sensitivity "variant"), which we mirror. compiled_data bakes
# the collation tables in (the locked "add ICU crate" decision). `try_new` returns
# a `CollatorBorrowed<'static>` over the baked tables — `Sync`, held in a static.
icu = "2.2"

# IANA-timezone offset lookup for chat_timestamp (v4's Intl-based timestamp
# formatting). The ONLY thing chat_timestamp needs a TZDB for is the DST-correct
# UTC offset of an IANA zone at a precise instant — every other part of v4's
# `Intl.DateTimeFormat('en-US', …)` output (month/day names, AM/PM, the `" at "`
# separator, the `±HH:MM` offset string) is a fixed en-US literal computed here
# from the offset-adjusted date-parts. ICU4X's `icu_time` offset API is
# name-timestamp-granular (returns a zone's standard AND daylight offsets, not
# the one in effect at an instant) so it can't resolve the exact offset across a
# DST transition; `jiff` bundles its own TZDB and IS instant-exact — its
# `to_offset` matches Intl/Date byte-for-byte on every corpus instant (both US
# DST boundaries, US/European/half-hour/quarter-hour zones) and errors on an
# unknown zone exactly as `Intl.DateTimeFormat` throws. Version pinned like the
# neighbors. Default features (bundled tzdb) suffice; no jiff formatting/parsing
# of ours reaches the wire — only `Timestamp::from_millisecond` + `to_offset`.
jiff = "0.2.31"

# Async runtime for the Phase-3 writer-task runtime (db::runtime): mpsc/oneshot
# channels are the "channel is the only mutator" seam. Only `sync` is needed in
# the library itself — the writer runs on a plain OS thread (not a tokio worker),
# so no scheduler is pulled into the core. The `macros` + `rt-multi-thread`
# features (for `#[tokio::test]`) live in dev-dependencies below.
#
# `time` joined `sync` for P4.D39's `OUTFIT_LLM_TIMEOUT_MS` and is now
# load-bearing at FOUR call sites (P4.D42 added the transport stream bound, the
# cheap-LLM attempt deadline, and the memory-recap phase ceiling). It brings the
# timer TYPES only — the driver comes from whichever runtime the caller is on,
# so "every runtime in the tree is built with `enable_all`/`enable_time`" is a
# LOAD-BEARING INVARIANT, not an observation: a runtime built without the time
# driver panics the moment any of those four awaits is reached (two harness
# test runtimes did exactly that in P4.D42's sweep).
tokio = { version = "1", default-features = false, features = ["sync", "time"] }

# P4.D39: `futures_util::future::join_all` is the faithful mapping of v4's
# `Promise.allSettled` over the per-character outfit resolvers — the chat-start
# consults must overlap (serially, one stalled provider held up a whole cast for
# 2m32s). Only `alloc` is needed: no executor, no IO, and the futures joined
# here are deliberately NOT `Send` (they hold `&Connection`), which `join_all`
# is happy with and a hand-rolled poll loop would be easy to get subtly wrong
# about.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# P4.18: structured `tracing` events at the swallow sites (the job runner, the
# cheap-LLM failed-call row, the `eprintln!` conversions). `tracing` is already
# transitive here via the axum/tokio stack; making it a direct dep only pins
# the macro surface. The subscriber that renders these events lives in the bins
# (`quilltap-web`), never in the library — the library only emits.
tracing = "0.1"

# W4.7d: the concrete `reqwest` provider transport, behind the NON-DEFAULT
# `native-transport` feature so the default core build stays IO-free (the STOP
# rule). rustls (not native-tls) to avoid an OpenSSL system dep. Only compiled
# when the feature is on; expected to migrate to the CLI/host crate later.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"], optional = true }
# P4.9G5: the backup archive. v4 shells out to `zip -r`/`unzip`; v5 links a zip
# crate instead (the pre-approved mechanism divergence — the archive TREE is the
# equivalence claim, never the zip framing). deflate-flate2 only: flate2 is
# already in the tree, and none of the exotic codecs (bzip2/lzma/zstd/aes) can
# appear in an archive Quilltap itself wrote.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# zip's `deflate-flate2` brings flate2 in WITHOUT a compression backend; naming
# flate2 directly here selects its default pure-Rust `rust_backend`
# (miniz_oxide), the same backend the harness already links — no C zlib, and no
# change to any existing DEFLATE output in the tree.
flate2 = "1"

[features]
# Pulls the reqwest transport + the tokio runtime it needs. NON-DEFAULT: the
# default core build has neither reqwest nor a tokio scheduler.
native-transport = ["dep:reqwest", "tokio/rt", "tokio/rt-multi-thread"]

[dev-dependencies]
tempfile = "3"
# Test-only: the runtime self-tests use `#[tokio::test]` and a multi-thread
# runtime to exercise concurrent writers. Feature-unioned with the dep above.
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread", "sync", "test-util"] }
# P4.18 unit 5: the job-runner smoke test installs a capturing `Layer` to assert
# a failed job emits a `tracing` event (the render subscriber lives in the bins,
# but the test needs one to observe the event).
tracing-subscriber = { version = "0.3", features = ["registry"] }
