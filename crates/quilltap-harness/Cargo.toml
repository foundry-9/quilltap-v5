[package]
name = "quilltap-harness"
version = "0.0.441"
edition = "2021"
publish = false

# Differential test harness. Compares the Rust port in quilltap-core against
# the TS oracle's captured output. Tier-1 (exact numeric equivalence) for the
# pure scoring functions; later phases add tier-2 (structural DB diff) and
# tier-3 (mocked-LLM) cases.
#
# The oracle's NDJSON is produced out-of-band by harness/oracle (run inside the
# v4 server checkout) and its path passed via QT_ORACLE_WEIGHTING. The test is
# skipped-with-warning if that file is absent, so `cargo test` stays green on a
# machine without the server checkout, but fails loudly if the file exists and
# disagrees.

[dependencies]
quilltap-core = { path = "../quilltap-core" }
serde = { version = "1", features = ["derive"] }
# preserve_order so the harness's own `Value` re-serialization (canonical dumps,
# normalization) matches the core's insertion-order JSON — see quilltap-core.
# float_roundtrip so parsing an oracle's exact-float text (e.g. a price like
# `0.09999999999999999`) is correctly rounded, matching the core's own f64 —
# the default fast parser is 1-ULP lossy (the W4.7e pricing rates surface it).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
# The Phase-3 tier-3 differential (the memory gate) drives an async service, so
# its test is `#[tokio::test]`. Only the test tree needs a runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
# The wardrobe-transfers tier-2 differential normalizes minted uuids / ISO
# timestamps embedded INSIDE content-addressed .md bytes (a copy writes them into
# the frontmatter), then recomputes the content-addressed shas from the
# normalized bytes so both sides align. Only that test tree needs these.
sha2 = "0.10"
# The P4.9G5 backup differential hashes the archive's binary payloads (staged
# user files + doc-mount blob bytes) rather than diffing them inline, and
# UNZIPS the archive `create_backup` produces to prove the zip round-trip
# preserves the staged tree exactly.
hex = "0.4"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
regex = "1"
# The file-attachment tier-3 differential base64-encodes the fixture's per-file
# bytes to build the (B) processFileAttachmentFallback `data` payload.
base64 = "0.22"
# The ST-PNG differential inflates the placeholder leg's IDAT to diff the decoded
# raw scanlines (v4 zlib-compresses, the port stores — the declared DEFLATE seam,
# compared at the decoded level, not byte-exact).
flate2 = "1"
# The logLLMCall regen differentials (W4.10b) open a real single-writer `Db` with
# the llm-logs partition and dump the written `llm_logs` rows.
tempfile = "3"
# The P4.1b help-doc-sync differential walks the committed fixture help tree
# through the HOST walker (the production dir-walk half of the injected file
# list), so the walk order under test is the real one.
quilltap-host = { path = "../quilltap-host" }
# The P4.4 provisioning differential dumps `sqlite_master` + the seed rows from a
# v5-provisioned instance (raw reads over the writer connection) to diff against
# the v4 oracle. Links the workspace sqlite3 (the sys crate), NOT bundled.
rusqlite = { workspace = true }
