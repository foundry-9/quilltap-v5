[package]
name = "quilltap-host"
version = "0.0.70"
edition = "2021"
publish = false

# The composition root (Phase-4 D8/D20): the ONLY crate that turns the core's
# injected seams into real IO — tokio timers/cadence for the job runner and
# the enclave schedule tick, instance-registry + data-dir resolution, and (as
# the P4.1 lanes land) provider HTTP, file bytes, image codecs, PTY, fs.
# The core keeps its default-build purity; this crate owns the scheduler.

[dependencies]
# The host is the crate that turns the core's IO seams into real IO (P4.1a):
# `native-transport` pulls the core's feature-gated `ReqwestTransport` for the
# streaming composer + `execute_completion`.
quilltap-core = { path = "../quilltap-core", features = ["native-transport"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The host HTTP client behind the core's `WireTransport`/`SyncWireTransport`
# seams + the live pricing fetch. rustls (no system OpenSSL); `blocking` for
# the sync boundaries (web search, pricing), always driven on a dedicated
# thread (a blocking client cannot run on a tokio runtime thread).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "blocking"] }
# The host owns all cadence (D20): a multi-thread runtime + timers. `sync` for
# Notify/watch; the core itself stays scheduler-free.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# P4.18: structured `tracing` events at the host swallow sites (the job pump
# orphan-reset / stuck-sweep errors, the spine's transport-shell error frames,
# the general-state seeding). The subscriber lives in the bins; the host emits.
tracing = "0.1"
# System IANA timezone for the enclave cron driver (v4 evaluates crons in the
# process zone). Same pinned line as the core's.
jiff = "0.2"
# The PTY host driver (P4.1c, D5) — the session manager over the native PTY,
# replacing v4's node-pty.
portable-pty = "0.9.0"
# Session ids (v4 randomUUID) for spawned terminals.
uuid = { version = "1", features = ["v4"] }
# SIGTERM delivery to spawned shells (P4.1c — v4 `pty.kill('SIGTERM')`;
# portable-pty's own kill() is SIGKILL) and the instance lock's PID liveness
# (P4.1d — `kill(pid, 0)` + hostname for the lock-file identity). Unix-only
# usage; Windows falls back conservatively.
libc = "0.2"
# The image codec (P4.1b, D19 pure-Rust-first): `image` decodes/resizes/encodes
# PNG/JPEG/GIF/TIFF/WebP(decode); lossy WebP ENCODING has no mature pure-Rust
# encoder, so `webp` (libwebp bindings — a C compile, the sqlite3mc precedent)
# provides it. AVIF/HEIC decode are NOT wired (no dav1d/libheif) — those inputs
# take the ported failure-passthrough policy branch (stored as-is).
image = "0.25"
webp = "0.3"
# The avatar-preview renderer (P4.6bf) decodes the provider's base64 image bytes
# (v4 `Buffer.from(rawData, 'base64')`) before the WebP transcode. Same pinned
# line as the core's.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
# Fixture seeding in the integration tests (same pinned line as the core).
rusqlite = { workspace = true }
