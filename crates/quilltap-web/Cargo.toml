# quilltap-web — the axum HTTP transport (Phase-4 P4.2, decisions D1–D5).
#
# The first-class no-auth local-web deployment: POST /api/dispatch + one
# scope-tagged GET /api/events SSE stream + the binary resource GETs + the
# terminal REST/WebSocket surface + static SPA serving. Thin by decree — the
# router marshals the core `Request`/`Response`/`Event` contract and nothing
# else; every decision lives behind `CoreEngine::dispatch`.

[package]
name = "quilltap-web"
version = "0.0.40"
edition = "2021"
publish = false

[dependencies]
quilltap-core = { path = "../quilltap-core", features = ["native-transport"] }
quilltap-host = { path = "../quilltap-host" }
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The photo-gallery write closures name the `rusqlite::Connection` the ported
# core service takes (the writer thread hands them out per partition).
rusqlite = { workspace = true }
# The P4.6y multipart legs: file bytes ride the dispatch variants as base64;
# the raw-read fs branch hashes the on-disk bytes for X-File-Sha256.
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
# P4.18: the process-global log surface. `tracing` events are emitted at the
# swallow sites (v4's hand-rolled Logger analog); `tracing-subscriber` is the
# stderr fmt subscriber, env-filtered by `RUST_LOG` (default `info` — v4's
# `LOG_LEVEL` default INFO). `tower-http`'s TraceLayer is the request-log
# analog of v4's `logRequest`, mounted at `debug` (unit 4).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
tempfile = "3"
# Test HTTP client (already in the tree via quilltap-host).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "multipart", "json"] }
# Test WebSocket client for the terminal stream route.
tokio-tungstenite = "0.24"
futures-util = "0.3"
# Fixture user-id rewrite (same pinned line as the workspace).
rusqlite = { workspace = true }
