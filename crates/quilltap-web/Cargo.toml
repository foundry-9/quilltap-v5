# quilltap-web — the axum HTTP transport (Phase-4 P4.2, decisions D1–D5).
#
# The first-class no-auth local-web deployment: POST /api/dispatch + one
# scope-tagged GET /api/events SSE stream + the binary resource GETs + the
# terminal REST/WebSocket surface + static SPA serving. Thin by decree — the
# router marshals the core `Request`/`Response`/`Event` contract and nothing
# else; every decision lives behind `CoreEngine::dispatch`.

[package]
name = "quilltap-web"
version = "0.0.7"
edition = "2021"
publish = false

[dependencies]
quilltap-core = { path = "../quilltap-core", features = ["native-transport"] }
quilltap-host = { path = "../quilltap-host" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
# Test HTTP client (already in the tree via quilltap-host).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# Test WebSocket client for the terminal stream route.
tokio-tungstenite = "0.24"
futures-util = "0.3"
# Fixture user-id rewrite (same pinned line as the workspace).
rusqlite = { workspace = true }
